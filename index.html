<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Reflex</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── HEADER ──────────────────────────────────────────── -->
  <header class="app-header">
    <span class="app-title">English Reflex</span>
    <div class="header-controls">
      <button id="btn-voice" class="btn-voice on">🔊 Voice ON</button>
    </div>
  </header>

  <main class="app-main">

    <!-- ── FLASH MESSAGE ────────────────────────────────────── -->
    <div id="flash-msg" class="error-msg hidden"></div>

    <!-- ── QUESTION CARD ────────────────────────────────────── -->
    <div id="question-card" class="card">

      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width:0%"></div>
      </div>
      <div id="progress-label" class="progress-label">1 / 25</div>

      <div style="margin-top:18px">
        <span id="category-tag" class="category-tag">Daily Life</span>
        <div class="question-row">
          <p id="question-text" class="question-text">Loading…</p>
          <button id="btn-replay" class="btn-replay" title="Replay question">🔊</button>
        </div>
      </div>

      <div class="divider" style="margin-top:20px"></div>

      <!-- Countdown -->
      <div id="countdown-section" class="countdown-wrap hidden">
        <div style="position:relative;width:110px;height:110px;flex-shrink:0">
          <svg viewBox="0 0 80 80" width="110" height="110" style="transform:rotate(-90deg)">
            <circle class="ring-bg" cx="40" cy="40" r="35"/>
            <circle id="ring-progress" class="ring-progress" cx="40" cy="40" r="35"
              stroke-dasharray="219.9" stroke-dashoffset="0"/>
          </svg>
          <div id="countdown-number" class="countdown-number"
               style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem">5</div>
        </div>
        <div id="countdown-label" class="countdown-label">seconds to start speaking</div>
      </div>

      <!-- Mic -->
      <div id="mic-section" class="mic-section hidden">
        <button id="btn-mic" class="btn-mic" title="Start recording">🎤</button>
        <span class="btn-mic-label">Tap to speak</span>
      </div>

      <!-- Recording -->
      <div id="recording-section" class="recording-indicator hidden" style="padding-top:16px">
        <div class="recording-badge"><div class="rec-dot"></div>RECORDING</div>
        <p class="recording-prompt">Speak now… take as long as you need.</p>
        <button id="btn-stop" class="btn-stop">⏹ Stop</button>
      </div>

      <!-- Recorded -->
      <div id="recorded-section" class="recorded-section hidden" style="margin-top:16px">
        <p class="section-label">Your answer</p>
        <audio id="audio-player" class="audio-player" controls></audio>
        <button id="btn-show-answer" class="btn btn-primary" style="margin-top:4px">
          Show Model Answer
        </button>

        <!-- Model answer -->
        <div id="model-answer-section" class="hidden">
          <div class="model-answer-header">
            <p class="section-label" style="margin-top:0">Model answer</p>
            <button id="btn-listen-answer" class="btn-listen" title="Listen to model answer">🔊 Listen</button>
          </div>
          <p id="model-answer-text" class="model-answer-text"></p>
          <div class="btn-row" style="margin-top:14px">
            <button id="btn-try-again" class="btn btn-secondary">↩ Try Again</button>
            <button id="btn-next" class="btn btn-primary">Next →</button>
          </div>
        </div>
      </div>

      <!-- Timeout -->
      <div id="timeout-section" class="hidden">
        <div class="state-banner">
          <div class="banner-icon">⏰</div>
          <div class="banner-title">Time's Up</div>
          <div class="banner-sub">You didn't tap the mic in 5 seconds.</div>
        </div>
        <div style="text-align:center;margin-top:12px">
          <button id="btn-try-again-timeout" class="btn btn-secondary">↩ Try Again</button>
        </div>
      </div>

    </div><!-- /question-card -->

    <!-- ── DATA SOURCE CARD ──────────────────────────────────── -->
    <div class="card import-section">
      <p id="data-source-info" class="import-info" style="margin-bottom:12px">Loading…</p>

      <!-- Manual sync button (ẩn nếu không có Sheet ID) -->
      <div id="sync-row" class="hidden" style="margin-bottom:14px">
        <button id="btn-sync" class="btn btn-secondary" style="font-size:0.82rem">
          ⟳ Sync từ Google Sheet
        </button>
      </div>

      <div class="source-divider" style="margin:10px 0">— hoặc import file cục bộ —</div>

      <div class="import-row">
        <label for="file-input" class="label-btn">📂 Import questions.json</label>
        <input type="file" id="file-input" accept=".json,application/json" />
        <button id="btn-reset" class="btn btn-ghost" style="font-size:0.78rem">Reset to default</button>
      </div>
    </div>

  </main>

  <!-- config.js phải load TRƯỚC app.js -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
